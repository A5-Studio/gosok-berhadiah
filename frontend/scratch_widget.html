<!--
  GOSOK BERHADIAH — WordPress / Elementor HTML widget (v7)
  =========================================================
  Changes from v6:
    - Reminder/disbursement note logic reworked for 3 distinct states:
        State A — all cards unscratched:
          Show full reminder box (image-2 style) with disbursement + grand prize + deadline info
        State B — mix (some scratched, some unscratched still remain):
          Same full reminder box as State A
        State C — all scratched, NO draw tickets:
          Show disbursement-only note (no Grand Prize / @bukuwarung_ mention)
        State D — all scratched, HAS draw ticket(s):
          Show draw-focused note (tune in to livestream) — existing behaviour kept
    - renderAllScratched(): summary row "Kartu berhadiah aktif" now hidden when count is 0
    - renderAllScratched(): disbursement note is now context-aware (draw vs no-draw)
    - draw code masked value updated from "GSK-••••" to "GOSOK-•••••" (5-char suffix)

  BACKEND PREREQUISITES (must be in place first):
    - DRAW_ENTRIES sheet has a 'draw_code' column
    - 04_Redeem.gs generates the code at scratch time
    - 03_Lookup.gs and 04_Redeem.gs return draw_code in their responses

  BEFORE PASTING:
  1. Update API_URL constant below with your Apps Script /exec URL
  2. Test by visiting that URL with ?action=health — should return {"ok":true,...}
-->

</style>

<script>
    (function () {
        /* =========================================================
           CONFIGURATION — UPDATE THIS BEFORE PASTING TO WORDPRESS
           ========================================================= */
        const API_URL = 'https://script.google.com/macros/s/YOUR_DEPLOYMENT_ID/exec';
        /* ========================================================= */

        let currentMerchantName = '';
        let currentUid = '';          // set once after successful lookup, used by all subsequent calls
        let activeScratchSession = null;
        let cardCache = {};

        const $ = (id) => document.getElementById(id);

        function showToast(msg) {
            const t = $('ga-toast');
            t.textContent = msg;
            t.classList.add('show');
            setTimeout(() => t.classList.remove('show'), 2200);
        }
        function setLoading() { $('ga-body').innerHTML = '<div class="ga-loading">Mengecek kartu kamu...</div>'; }
        function showError(msg) { $('ga-body').innerHTML = '<div class="ga-loading">' + esc(msg) + '</div>'; }

        /**
         * Normalizes any phone number format to a bare digit string starting with '8'.
         * Handles: 08xxx, 628xxx, +628xxx, 8xxx, spaces, dashes, dots.
         * Examples:
         *   "0812-3456-7890"  → "81234567890"
         *   "62 812 3456 7890" → "81234567890"
         *   "+62812.3456.7890" → "81234567890"
         *   "812 3456 7890"   → "81234567890"
         */
        function normalizeUid(raw) {
            // Strip everything except digits
            let digits = raw.replace(/\D/g, '');
            // Remove country code prefix: 62 → strip, leaving bare number
            if (digits.startsWith('62')) digits = digits.slice(2);
            // Remove leading zero
            if (digits.startsWith('0')) digits = digits.slice(1);
            return digits; // e.g. "81234567890"
        }

        function onCheck() {
            const uid = normalizeUid($('ga-uid-input').value);
            if (!uid) { showToast('Masukin nomor HP dulu'); return; }
            currentUid = '';   // reset until new lookup succeeds
            setLoading();
            callLookup(uid);
        }

        function callLookup(uid) {
            const url = API_URL + '?action=lookup&uid=' + encodeURIComponent(uid);
            fetch(url, { method: 'GET', redirect: 'follow' })
                .then(r => r.text())
                .then(text => {
                    try { return JSON.parse(text); }
                    catch (e) { throw new Error('Not JSON: ' + text.substring(0, 200)); }
                })
                .then(renderState)
                .catch(err => showError('Gagal terhubung: ' + err.message));
        }

        function callRedeem(payload, onDone) {
            const params = new URLSearchParams({
                action: 'redeem',
                card_id: payload.card_id,
                uid: payload.uid,
                idempotency_key: payload.idempotency_key || '',
                user_agent: payload.user_agent || ''
            });
            fetch(API_URL + '?' + params.toString(), { method: 'GET', redirect: 'follow' })
                .then(r => r.text())
                .then(text => {
                    try { return JSON.parse(text); }
                    catch (e) { throw new Error('Not JSON: ' + text.substring(0, 200)); }
                })
                .then(onDone)
                .catch(err => {
                    console.error('[redeem] error:', err);
                    const isNetwork = err.message && (err.message.toLowerCase().includes('fetch') || err.message.toLowerCase().includes('network'));
                    onDone({
                        ok: false, error: 'network_error', message: isNetwork
                            ? 'Koneksi bermasalah. Pastikan internet aktif lalu coba lagi.'
                            : err.message
                    });
                });
        }

        function renderState(resp) {
            if (!resp || !resp.ok) {
                showError('Error: ' + ((resp && (resp.message || resp.error)) || 'unknown'));
                return;
            }
            currentMerchantName = resp.merchant_name || '';
            currentUid = resp.uid || '';
            cardCache = {};
            if (resp.orders) {
                resp.orders.forEach(o => {
                    (o.cards || []).forEach(c => { cardCache[c.card_id] = c; });
                });
            }
            if (resp.state === 'no_order') return renderNoOrder(resp);
            if (resp.state === 'order_pending') return renderPending(resp);
            if (resp.state === 'cards_ready') return renderCards(resp);
            if (resp.state === 'all_scratched') return renderAllScratched(resp);
        }

        function renderNoOrder() {
            $('ga-body').innerHTML =
                '<div class="ga-empty-state">' +
                '<div class="ga-empty-icon">🔍</div>' +
                '<h3 class="ga-empty-title">Hmm.. kartu hadiah belum ada</h3>' +
                '<p class="ga-empty-desc">Karena belum ada pembelian EDC BukuAgen selama periode promo untuk nomor ini.</p>' +
                '<p class="ga-empty-desc">Yuk beli EDC BukuAgen sekarang &amp; gosok kartu berhadiahnya!</p>' +
                '</div>';
        }

        function renderPending(resp) {
            const o = resp.orders[0];
            $('ga-body').innerHTML =
                '<div class="ga-order-block">' +
                '<div class="ga-order-head"><div>' +
                '<div class="ga-order-prod">EDC ' + esc(stripNew(o.product_name)) + '</div>' +
                '<div class="ga-order-meta">Pesanan ' + formatDate(o.paid_at_jkt) + ' · Rp ' + fmtIdr(o.price_idr) + '</div>' +
                '</div><span class="ga-status-badge ga-status-pending">⏳ Diproses</span></div>' +
                '<div class="ga-empty-state" style="padding-top:8px">' +
                '<div class="ga-empty-icon" style="background:var(--ga-amber-bg);color:var(--ga-amber-text)">📦</div>' +
                '<h3 class="ga-empty-title">Kartu Juragan lagi diproses</h3>' +
                '<p class="ga-empty-desc">Kartu berhadiah akan muncul jika pembelian sudah dikonfirmasi dan verifikasi Juragan sudah selesai diproses.</p>' +
                '<p class="ga-empty-desc">Cek lagi nanti ya, Gan!</p>' +
                '</div></div>';
        }

        function renderCards(resp) {
            let html = '';
            const eligible = resp.orders.filter(o => o.eligible);
            eligible.forEach((o, i) => {
                html += renderOrderBlock(o);
                if (i < eligible.length - 1) html += '<div class="ga-divider-thin"></div>';
            });
            // Show the full reminder (State A & B): has unscratched cards
            html += buildReminderNote('has_unscratched');
            $('ga-body').innerHTML = html;
        }

        function renderOrderBlock(o) {
            const isAndroid = o.product_name.indexOf('Android') !== -1;
            const unscratchedCount = o.cards.filter(c => c.status === 'bound').length;
            const statusBadge = unscratchedCount > 0
                ? '<span class="ga-status-badge ga-status-ready">✓ Siap digosok</span>'
                : '<span class="ga-status-badge ga-status-scratched">Selesai</span>';
            const gridClass = o.cards.length === 1 ? 'ga-cards-grid single' : 'ga-cards-grid';
            let html = '<div class="ga-order-block">' +
                '<div class="ga-order-head"><div>' +
                '<div class="ga-order-prod">EDC ' + esc(stripNew(o.product_name)) +
                (isAndroid ? '<span class="ga-badge-quota">2× kartu</span>' : '') + '</div>' +
                '<div class="ga-order-meta">Pesanan ' + formatDate(o.paid_at_jkt) + ' · Rp ' + fmtIdr(o.price_idr) + '</div>' +
                '</div>' + statusBadge + '</div>' +
                '<div class="' + gridClass + '">';
            o.cards.forEach(c => { html += renderCardTile(c, o); });
            html += '</div></div>';
            return html;
        }

        function renderCardTile(c, o) {
            if (c.status === 'bound') {
                return '<div class="ga-card-tile unscratched clickable" data-action="scratch" data-card-id="' + esc(c.card_id) + '" data-order-id="' + esc(o.order_id) + '" data-seq="' + c.sequence_no + '">' +
                    '<div class="ga-card-num">KARTU BERHADIAH #' + c.sequence_no + '</div>' +
                    '<div class="ga-scratch-circle">👆</div>' +
                    '<div class="ga-scratch-label">Gosok di sini sekarang!</div>' +
                    '</div>';
            }
            if (c.outcome_type === 'cash' && c.cash_prize) {
                const disb = c.disbursement || {};
                const disbLabel = disb.status === 'sent' ? 'Sudah dicairkan'
                    : disb.status === 'queued' ? ('Cair batch ' + (disb.batch || ''))
                        : (disb.batch || '');
                return '<div class="ga-card-tile cash-win clickable" data-action="reopen" data-card-id="' + esc(c.card_id) + '" data-seq="' + c.sequence_no + '">' +
                    '<div class="ga-card-num" style="color:var(--ga-cream-text);opacity:0.75">KARTU #' + c.sequence_no + '</div>' +
                    '<div class="ga-cash-label-small">Kamu menang</div>' +
                    '<div class="ga-cash-amount">Rp ' + fmtIdr(c.cash_prize.value_idr) + '</div>' +
                    '<div class="ga-cash-tier">' + esc(disbLabel) + '</div>' +
                    '<div class="ga-tap-hint">TAP UNTUK LIHAT</div>' +
                    '</div>';
            }
            if (c.outcome_type === 'draw' && c.draw_entry) {
                const de = c.draw_entry;
                const isWon = de.result === 'won';
                const isNotDrawn = de.result === 'not_drawn';
                let label = 'Masuk pool undian!';
                let date = 'LIVE ' + fmtDateId(de.livestream_date);
                if (isWon && de.grand_prize) { label = 'KAMU MENANG'; date = esc(de.grand_prize.label); }
                if (isNotDrawn) { label = 'Belum beruntung kali ini'; date = 'Undian ' + fmtDateId(de.livestream_date); }
                const code = de.draw_code || '';
                const codeBlock = code
                    ? '<div class="ga-draw-code" data-code="' + esc(code) + '" data-revealed="false" onclick="event.stopPropagation(); window.toggleDrawCode(this)">' +
                    '<span class="ga-draw-code-label">KODE</span>' +
                    '<span class="ga-draw-code-value">GOSOK-•••••</span>' +
                    '<span class="ga-draw-code-toggle">👁</span>' +
                    '</div>'
                    : '';
                return '<div class="ga-card-tile draw-win clickable" data-action="reopen" data-card-id="' + esc(c.card_id) + '" data-seq="' + c.sequence_no + '">' +
                    '<div class="ga-card-num" style="color:var(--ga-pink-text);opacity:0.75">KARTU #' + c.sequence_no + '</div>' +
                    '<div class="ga-draw-pill">' + (isWon ? 'PEMENANG!' : 'HADIAH SPESIAL') + '</div>' +
                    '<div class="ga-draw-label">' + esc(label) + '</div>' +
                    '<div class="ga-draw-date">' + esc(date) + '</div>' +
                    codeBlock +
                    '<div class="ga-tap-hint">TAP UNTUK LIHAT</div>' +
                    '</div>';
            }
            return '<div class="ga-card-tile">Kartu #' + c.sequence_no + '</div>';
        }

        /**
         * Builds the bottom reminder/info note based on the current page state.
         *
         * mode:
         *   'has_unscratched'      — State A & B: one or more cards still unscratched
         *                           Show: disbursement day + Grand Prize draw + deadline
         *   'all_scratched_draw'   — State D: all scratched AND merchant has draw ticket(s)
         *                           Show: tune-in-to-livestream note
         *   'all_scratched_no_draw'— State C: all scratched, no draw tickets at all
         *                           Show: disbursement schedule only, NO @bukuwarung_ mention
         */
        function buildReminderNote(mode) {
            if (mode === 'has_unscratched') {
                // Matches image 2 exactly
                return '<div class="ga-disbursement-note">' +
                    'Hadiah <strong>Komisi Agen</strong> akan dikirim pada hari <strong>Jumat</strong> ' +
                    'setelah kartu digosok. Hadiah Grand Prize akan diundi LIVE di Instagram ' +
                    '<strong>@bukuwarung_</strong>. Gosok kartu paling lambat ' +
                    '<strong>8 Juli 2026 11.59 WIB</strong> &amp; dapatkan hadiahnya!' +
                    '</div>';
            }
            if (mode === 'all_scratched_draw') {
                // State D — has draw ticket, remind about livestream
                return '<div class="ga-disbursement-note">' +
                    'Jangan lupa tonton undian hadiah Grand Prize di LIVE Streaming Instagram ' +
                    '<strong>@bukuwarung_</strong>! Pastikan Juragan hadir saat live ya.' +
                    '</div>';
            }
            // State C — all scratched, cash prizes only, no draw
            return '<div class="ga-disbursement-note">' +
                'Hadiah <strong>Komisi Agen</strong> Juragan akan dikirimkan ke saldo BukuAgen ' +
                'sesuai jadwal pencairan batch. Terima kasih sudah ikut Gosok Berhadiah BukuAgen!' +
                '</div>';
        }

        function renderAllScratched(resp) {
            const s = resp.summary;
            const hasDrawTickets = s.draw_tickets_active > 0;

            let cardsHtml = '';
            resp.orders.forEach(o => o.cards.forEach(c => { cardsHtml += renderCardTile(c, o); }));

            // Summary rows — hide draw row when merchant has no active draw tickets
            const drawRow = hasDrawTickets
                ? '<div class="ga-summary-row"><span class="ga-summary-label">Tiket undian Grand Prize</span><span class="ga-summary-val" style="color:var(--ga-pink-text)">' + s.draw_tickets_active + ' tiket</span></div>'
                : '';

            $('ga-body').innerHTML =
                '<div class="ga-section-label">Ringkasan Hadiah Juragan</div>' +
                '<div class="ga-summary-card">' +
                '<div class="ga-summary-row"><span class="ga-summary-label">Total kartu digosok</span><span class="ga-summary-val">' + s.cards_scratched + ' kartu</span></div>' +
                '<div class="ga-summary-row"><span class="ga-summary-label">Total hadiah Komisi Agen</span><span class="ga-summary-val" style="color:var(--ga-green-text)">Rp ' + fmtIdr(s.total_komisi_won_idr) + '</span></div>' +
                '<div class="ga-summary-row"><span class="ga-summary-label">Total hadiah dikirim</span><span class="ga-summary-val">Rp ' + fmtIdr(s.komisi_disbursed_idr) + '</span></div>' +
                drawRow +
                '</div>' +
                '<div class="ga-section-label">Riwayat Gosok Berhadiah Juragan</div>' +
                '<div class="ga-cards-grid">' + cardsHtml + '</div>' +
                // State C (no draw) vs State D (has draw) — different note
                buildReminderNote(hasDrawTickets ? 'all_scratched_draw' : 'all_scratched_no_draw');
        }

        /* Toggle for the masked draw code on card tiles. Exposed on window
           so the inline onclick can reach it from outside the IIFE. */
        window.toggleDrawCode = function (el) {
            const revealed = el.dataset.revealed === 'true';
            const valueEl = el.querySelector('.ga-draw-code-value');
            if (revealed) {
                valueEl.textContent = 'GOSOK-•••••';
                el.dataset.revealed = 'false';
            } else {
                valueEl.textContent = el.dataset.code;
                el.dataset.revealed = 'true';
            }
        };

        /* ====================================================================
           POPUP CONTROL — single popup, two modes via .mode-celebrating class
           ==================================================================== */
        function setPopupMode(mode) {
            const body = $('ga-popup-body');
            if (mode === 'celebrating') {
                body.classList.add('mode-celebrating');
                $('ga-confetti-bg').classList.add('show');
                spawnConfetti();
            } else {
                body.classList.remove('mode-celebrating');
                $('ga-confetti-bg').classList.remove('show');
                $('ga-confetti-bg').innerHTML = '';
            }
        }

        function openScratchPopup(cardId, orderId, sequenceNo) {
            // Use stored uid from last successful lookup — never re-read from input field
            const uid = currentUid || normalizeUid($('ga-uid-input').value);
            if (!uid) {
                showToast('Session habis, masukkan nomor HP lagi');
                return;
            }
            activeScratchSession = { cardId: cardId, orderId: orderId, sequenceNo: sequenceNo, response: null, hasStarted: false, mode: 'scratch' };

            $('ga-popup-card-num').textContent = cardId;
            $('ga-celeb-status-pill').textContent = '';
            $('ga-celeb-status-pill').className = 'ga-celeb-status-pill';
            $('ga-celeb-msg').textContent = '';
            $('ga-celeb-footnote').textContent = '';
            $('ga-celeb-headline-pre').textContent = '';
            $('ga-celeb-headline-big').textContent = '';
            $('ga-celeb-headline-post').textContent = '';
            const _gr = $('ga-celeb-greeting'); if (_gr) _gr.textContent = '';
            const _dc = $('ga-celeb-draw-code'); if (_dc) _dc.innerHTML = '';

            setPopupMode('scratch');
            $('ga-scratch-instructions').classList.remove('fading');
            $('ga-scratch-hint').classList.remove('hidden');
            $('ga-scratch-hint').textContent = 'Gosok di area ini sampai hadiah terbuka';
            $('ga-scratch-loading').style.display = 'flex';
            $('ga-prize-layer').innerHTML = '';
            $('ga-scratch-canvas').classList.remove('revealed');
            $('ga-scratch-canvas').style.display = 'block';

            $('ga-scratch-popup').classList.add('show');
            document.body.classList.add('ga-popup-open');

            callRedeem({
                card_id: cardId, uid: uid,
                idempotency_key: cardId + '-' + Date.now(),
                user_agent: navigator.userAgent
            }, onRedeemResponse);
        }

        function onRedeemResponse(resp) {
            if (!resp.ok) {
                showToast(resp.message || resp.error || 'Gagal');
                closeScratchPopup();
                return;
            }
            activeScratchSession.response = resp;
            $('ga-scratch-loading').style.display = 'none';
            paintPrizeLayer({
                outcome_type: resp.outcome_type,
                cash_prize: resp.cash_prize,
                draw_entry: resp.draw_entry
            });
            requestAnimationFrame(function () { requestAnimationFrame(initScratchCanvas); });
        }

        /* Prize image URLs keyed by cash value (IDR) or 'draw' */
        const PRIZE_IMG = {
            5000: 'https://YOUR_CDN/prizes/5rb.png',
            10000: 'https://YOUR_CDN/prizes/10rb.png',
            20000: 'https://YOUR_CDN/prizes/20rb.png',
            50000: 'https://YOUR_CDN/prizes/50rb.png',
            100000: 'https://YOUR_CDN/prizes/100rb.png',
            200000: 'https://YOUR_CDN/prizes/200rb.png',
            draw: 'https://YOUR_CDN/prizes/Winner-card.png',
        };

        function prizeImgTag(type, valueIdr) {
            const src = type === 'draw' ? PRIZE_IMG['draw'] : (PRIZE_IMG[valueIdr] || '');
            if (!src) return '';
            return '<img class="ga-prize-img" src="' + src + '" alt="Hadiah" />';
        }

        function paintPrizeLayer(opts) {
            const layer = $('ga-prize-layer');
            layer.className = 'ga-prize-layer';
            if (opts.outcome_type === 'cash' && opts.cash_prize) {
                layer.innerHTML = prizeImgTag('cash', opts.cash_prize.value_idr);
            } else if (opts.outcome_type === 'draw' && opts.draw_entry) {
                layer.innerHTML = prizeImgTag('draw', null);
            }
        }

        /* CANVAS SCRATCH */
        let scratchCtx = null, scratchCanvas = null, isDrawing = false, lastSampleAt = 0, revealed = false, lastPoint = null;

        function initScratchCanvas() {
            scratchCanvas = $('ga-scratch-canvas');
            const rect = scratchCanvas.getBoundingClientRect();
            if (rect.width === 0) { setTimeout(initScratchCanvas, 60); return; }
            const dpr = Math.min(window.devicePixelRatio || 1, 2);
            scratchCanvas.width = Math.round(rect.width * dpr);
            scratchCanvas.height = Math.round(rect.height * dpr);
            scratchCtx = scratchCanvas.getContext('2d', { willReadFrequently: true });
            scratchCtx.scale(dpr, dpr);
            const w = rect.width, h = rect.height;
            const grad = scratchCtx.createLinearGradient(0, 0, w, h);
            grad.addColorStop(0, '#B8B5A8');
            grad.addColorStop(0.5, '#9C9788');
            grad.addColorStop(1, '#A39E90');
            scratchCtx.fillStyle = grad;
            scratchCtx.fillRect(0, 0, w, h);
            scratchCtx.fillStyle = 'rgba(255, 255, 255, 0.12)';
            for (let i = 0; i < 28; i++) {
                scratchCtx.beginPath();
                scratchCtx.arc(Math.random() * w, Math.random() * h, 1 + Math.random() * 2, 0, Math.PI * 2);
                scratchCtx.fill();
            }
            scratchCtx.fillStyle = 'rgba(0, 0, 0, 0.4)';
            scratchCtx.font = 'bold 14px -apple-system, sans-serif';
            scratchCtx.textAlign = 'center';
            scratchCtx.fillText('Gosok di area ini', w / 2, h / 2 - 8);
            scratchCtx.font = '11px -apple-system, sans-serif';
            scratchCtx.fillStyle = 'rgba(0, 0, 0, 0.3)';
            scratchCtx.fillText('sampai hadiah terbuka', w / 2, h / 2 + 12);
            revealed = false; isDrawing = false; lastPoint = null;
            scratchCanvas.onpointerdown = onPointerDown;
            scratchCanvas.onpointermove = onPointerMove;
            scratchCanvas.onpointerup = onPointerUp;
            scratchCanvas.onpointercancel = onPointerUp;
            scratchCanvas.onpointerleave = onPointerUp;
        }

        function getCanvasPoint(e) {
            const rect = scratchCanvas.getBoundingClientRect();
            return { x: e.clientX - rect.left, y: e.clientY - rect.top };
        }
        function onPointerDown(e) {
            if (revealed) return;
            e.preventDefault();
            isDrawing = true;
            try { scratchCanvas.setPointerCapture(e.pointerId); } catch (_) { }
            if (!activeScratchSession.hasStarted) {
                activeScratchSession.hasStarted = true;
                $('ga-scratch-instructions').classList.add('fading');
                /* Keep the hint consistent during scratch; just fade instructions */
                // hint text already set in openScratchPopup
            }
            const p = getCanvasPoint(e);
            lastPoint = p;
            scratchAt(p);
        }
        function onPointerMove(e) {
            if (!isDrawing || revealed) return;
            e.preventDefault();
            const p = getCanvasPoint(e);
            if (lastPoint) {
                const dx = p.x - lastPoint.x, dy = p.y - lastPoint.y;
                const dist = Math.sqrt(dx * dx + dy * dy);
                const steps = Math.ceil(dist / 8);
                for (let i = 1; i <= steps; i++) {
                    scratchAt({ x: lastPoint.x + (dx * i / steps), y: lastPoint.y + (dy * i / steps) });
                }
            } else { scratchAt(p); }
            lastPoint = p;
            const now = Date.now();
            if (now - lastSampleAt > 150) {
                lastSampleAt = now;
                if (computeRevealRatio() > 0.5) autoReveal();
            }
        }
        function onPointerUp() {
            if (!isDrawing) return;
            isDrawing = false; lastPoint = null;
            if (!revealed && computeRevealRatio() > 0.4) autoReveal();
        }
        function scratchAt(p) {
            scratchCtx.globalCompositeOperation = 'destination-out';
            scratchCtx.beginPath();
            scratchCtx.arc(p.x, p.y, 28, 0, Math.PI * 2);
            scratchCtx.fill();
        }
        function computeRevealRatio() {
            const w = scratchCanvas.width, h = scratchCanvas.height;
            let cleared = 0, total = 0;
            try {
                const img = scratchCtx.getImageData(0, 0, w, h).data;
                const step = Math.max(8, Math.floor(w / 50));
                for (let y = 0; y < h; y += step) {
                    for (let x = 0; x < w; x += step) {
                        const i = (y * w + x) * 4 + 3;
                        if (img[i] < 64) cleared++;
                        total++;
                    }
                }
            } catch (e) { return 0; }
            return total > 0 ? cleared / total : 0;
        }
        function autoReveal() {
            if (revealed) return;
            revealed = true;
            scratchCanvas.classList.add('revealed');
            $('ga-scratch-hint').classList.add('hidden');
            setTimeout(transitionToCelebration, 800);
        }

        function transitionToCelebration() {
            const resp = activeScratchSession.response;
            fillCelebrationCopy({
                outcome_type: resp.outcome_type,
                cash_prize: resp.cash_prize,
                draw_entry: resp.draw_entry,
                disbursement: resp.disbursement
            });
            setPopupMode('celebrating');
        }

        /* REOPEN — already-scratched card, no API call */
        function openResultPopup(cardId) {
            const card = cardCache[cardId];
            if (!card) { showToast('Data kartu tidak ditemukan, refresh halaman dulu'); return; }
            if (card.status !== 'scratched') { showToast('Kartu belum digosok'); return; }

            activeScratchSession = { cardId: cardId, sequenceNo: card.sequence_no, mode: 'reopen' };
            $('ga-popup-card-num').textContent = cardId;

            $('ga-scratch-loading').style.display = 'none';
            paintPrizeLayer({
                outcome_type: card.outcome_type,
                cash_prize: card.cash_prize,
                draw_entry: card.draw_entry
            });
            $('ga-scratch-canvas').style.display = 'none';

            fillCelebrationCopy({
                outcome_type: card.outcome_type,
                cash_prize: card.cash_prize,
                draw_entry: card.draw_entry,
                disbursement: card.disbursement
            });

            $('ga-scratch-popup').classList.add('show');
            document.body.classList.add('ga-popup-open');

            setTimeout(function () { setPopupMode('celebrating'); }, 200);
        }

        function fillCelebrationCopy(opts) {
            /* Personalized greeting above the prize card */
            const greetingEl = $('ga-celeb-greeting');
            if (greetingEl) {
                greetingEl.textContent = currentMerchantName
                    ? 'Selamat, Juragan ' + currentMerchantName + '!'
                    : 'Selamat, Juragan!';
            }

            /* Headline block under the prize card */
            const pre = $('ga-celeb-headline-pre');
            const big = $('ga-celeb-headline-big');
            const post = $('ga-celeb-headline-post');
            pre.textContent = '';
            big.textContent = '';
            post.textContent = '';

            /* Status pill — kept for sent/won/not_drawn states only */
            const pill = $('ga-celeb-status-pill');
            pill.className = 'ga-celeb-status-pill';
            pill.textContent = '';

            let msg = '';
            let footnote = '';

            // Always clear draw code block — only shown for draw outcomes
            const _drawCodeEl = $('ga-celeb-draw-code');
            if (_drawCodeEl) _drawCodeEl.innerHTML = '';

            if (opts.outcome_type === 'cash' && opts.cash_prize) {
                pre.textContent = '🎉 Juragan menang hadiah uang';
                big.textContent = 'Rp ' + fmtIdr(opts.cash_prize.value_idr);
                post.textContent = 'dari Gosok Berhadiah BukuAgen';
                if (opts.disbursement && opts.disbursement.status === 'sent') {
                    pill.textContent = '✓ Sudah masuk Komisi Agen';
                    pill.classList.add('sent');
                }
                msg = 'Bagikan keseruan ini ke media sosial Juragan!';
                footnote = '*Hadiah akan dikirim ke Komisi Agen Juragan pada hari Jumat setelah kartu digosok.';
            } else if (opts.outcome_type === 'draw' && opts.draw_entry) {
                const de = opts.draw_entry;
                if (de.result === 'won' && de.grand_prize) {
                    pre.textContent = '🏆 Juragan menang hadiah utama';
                    big.textContent = esc(de.grand_prize.label);
                    post.textContent = 'Tim BukuAgen akan menghubungi Juragan untuk pengiriman hadiah.';
                    pill.classList.add('won');
                    pill.textContent = 'PEMENANG GRAND PRIZE';
                    msg = 'Bagikan keseruan ini ke media sosial Juragan!';
                } else if (de.result === 'not_drawn') {
                    pre.textContent = '';
                    big.textContent = 'Belum beruntung kali ini';
                    post.textContent = 'Wave kamu sudah diundi. Tetap semangat ya, Juragan!';
                    pill.textContent = '';
                } else {
                    /* pending draw — image on card already explains the prize, no headline needed */
                    pre.textContent = '';
                    big.textContent = '';
                    post.textContent = '';
                    pill.textContent = '⏳ Undian LIVE ' + fmtDateId(de.livestream_date);
                    // Draw code block below the card
                    const drawCodeEl = $('ga-celeb-draw-code');
                    if (drawCodeEl) {
                        const dc = de.draw_code || '';
                        drawCodeEl.innerHTML = dc
                            ? '<div class="ga-celeb-draw-code-label">Kode Undian</div>' +
                            '<div class="ga-celeb-draw-code-value">' + esc(dc) + '</div>'
                            : '';
                    }
                    msg = 'Tonton undian hadiah Grand Prize di LIVE Streaming Instagram @bukuwarung_ & bagikan keseruan ini di media sosial Juragan!';
                    footnote = '*Pemenang WAJIB hadir saat live. Jika tidak hadir, maka hadiah akan hangus.';
                }
            }

            $('ga-celeb-msg').textContent = msg;
            $('ga-celeb-footnote').textContent = footnote;
        }

        function spawnConfetti() {
            const c = $('ga-confetti-bg');
            if (!c) return;
            c.innerHTML = '';
            const colors = ['#FFC107', '#FF7043', '#42A5F5', '#66BB6A', '#EC407A'];
            for (let i = 0; i < 40; i++) {
                const s = document.createElement('span');
                s.style.left = Math.random() * 100 + '%';
                s.style.background = colors[Math.floor(Math.random() * colors.length)];
                s.style.animationDuration = (2.5 + Math.random() * 2) + 's';
                s.style.animationDelay = (Math.random() * 0.4) + 's';
                s.style.transform = 'rotate(' + (Math.random() * 360) + 'deg)';
                c.appendChild(s);
            }
        }

        function shareWin(opts) {
            let text = '';
            if (opts.outcome_type === 'cash' && opts.cash_prize) {
                text = 'Saya menang Rp ' + fmtIdr(opts.cash_prize.value_idr) + ' dari Gosok Berhadiah EDC BukuAgen!';
            } else if (opts.outcome_type === 'draw') {
                const code = opts.draw_entry && opts.draw_entry.draw_code ? opts.draw_entry.draw_code : '';
                text = 'Saya masuk Pool Hadiah Spesial Gosok Berhadiah BukuAgen!' +
                    (code ? ' Kode undian saya: ' + code : '');
            } else {
                text = 'Saya ikut Gosok Berhadiah EDC BukuAgen!';
            }
            if (navigator.share) {
                navigator.share({ text: text }).catch(function () { });
            } else {
                try { navigator.clipboard.writeText(text); showToast('Teks disalin!'); }
                catch (e) { showToast('Salin manual'); }
            }
        }

        function closeScratchPopup() {
            $('ga-scratch-popup').classList.remove('show');
            document.body.classList.remove('ga-popup-open');
            setPopupMode('scratch');
            if (activeScratchSession && activeScratchSession.mode === 'scratch') {
                const uid = currentUid || normalizeUid($('ga-uid-input').value);
                if (uid) callLookup(uid);
            }
            activeScratchSession = null;
        }

        function fmtIdr(n) { return Number(n || 0).toLocaleString('id-ID'); }
        function stripNew(s) { return String(s || '').replace(' - New', ''); }
        function formatDate(s) {
            if (!s) return '';
            const months = ['Jan', 'Feb', 'Mar', 'Apr', 'Mei', 'Jun', 'Jul', 'Agu', 'Sep', 'Okt', 'Nov', 'Des'];
            const d = new Date(s);
            return d.getDate() + ' ' + months[d.getMonth()];
        }

        /** Formats an ISO date string (yyyy-MM-dd) or Date to Indonesian long format, e.g. "17 Juni 2026". */
        function fmtDateId(s) {
            if (!s) return '';
            const months = ['Januari', 'Februari', 'Maret', 'April', 'Mei', 'Juni',
                'Juli', 'Agustus', 'September', 'Oktober', 'November', 'Desember'];
            const d = (s instanceof Date) ? s : new Date(String(s).replace(/(\d{4}-\d{2}-\d{2}).*/, '$1') + 'T00:00:00');
            return d.getDate() + ' ' + months[d.getMonth()] + ' ' + d.getFullYear();
        }
        function esc(s) {
            if (s == null) return '';
            return String(s).replace(/[&<>"']/g, function (c) {
                return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
            });
        }

        document.addEventListener('DOMContentLoaded', wireUp);
        if (document.readyState === 'interactive' || document.readyState === 'complete') wireUp();

        function wireUp() {
            if ($('ga-check-btn')._wired) return;
            $('ga-check-btn')._wired = true;
            $('ga-check-btn').addEventListener('click', onCheck);
            $('ga-uid-input').addEventListener('keydown', function (e) { if (e.key === 'Enter') onCheck(); });
            $('ga-close-btn').addEventListener('click', closeScratchPopup);
            $('ga-celeb-close').addEventListener('click', closeScratchPopup);

            $('ga-body').addEventListener('click', function (e) {
                const tile = e.target.closest('.ga-card-tile.clickable');
                if (!tile) return;
                const action = tile.dataset.action;
                if (action === 'scratch') {
                    openScratchPopup(tile.dataset.cardId, tile.dataset.orderId, Number(tile.dataset.seq));
                } else if (action === 'reopen') {
                    openResultPopup(tile.dataset.cardId);
                }
            });

            // Pre-filled link support: ?uid=08123456789 auto-fills and runs the lookup
            const urlUid = new URLSearchParams(window.location.search).get('uid');
            if (urlUid) {
                $('ga-uid-input').value = urlUid;
                onCheck();
            }
        }
    })();
</script>
